[graph]
all-features = true

[sources]
unknown-registry = "deny"

[licenses]
version = 2
confidence-threshold = 1.0
unused-allowed-license = "allow"

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",             # Although this is copyleft, it is scoped to modifying the original files
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[advisories]
ignore = [
  # Unmaintained `derivative`, pulled in by ark-crypto-primitives (still present in 0.6.0)
  "RUSTSEC-2024-0388",
  # Unmaintained `paste`, pulled in by ark-ff, alloy-primitives and ruint
  "RUSTSEC-2024-0436",
]
